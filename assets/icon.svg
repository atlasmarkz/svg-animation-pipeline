<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SVG Motion">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2c"/>
      <stop offset="0.55" stop-color="#0a0f1b"/>
      <stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.46" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="0.46" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.42" stop-color="#a78bfa"/>
      <stop offset="0.78" stop-color="#34d399"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#aurora)"/>
  <rect x="9" y="9" width="494" height="494" rx="115" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ring)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="784 134" transform="rotate(-58 256 256)"
          filter="url(#glow)" opacity="0.92"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ring)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="784 134" transform="rotate(-58 256 256)"/>

  <g filter="url(#shadow)">
    <circle cx="382" cy="330" r="17" fill="#fb7185" stroke="#0a0f1b" stroke-width="7"/>
    <circle cx="130" cy="330" r="17" fill="#a78bfa" stroke="#0a0f1b" stroke-width="7"/>
    <circle cx="256" cy="110" r="17" fill="#34d399" stroke="#0a0f1b" stroke-width="7"/>
  </g>

  <path d="M 206 194 L 316 256 L 206 318 Z" fill="url(#play)" stroke="url(#play)"
        stroke-width="18" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
